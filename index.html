<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    h3 { margin: 16px 0 4px; }
    .box { display: flex; background: #eee; margin-bottom: 8px; }
    .item { height: 50px; background: #0b5fff; border-right: 1px solid #fff; }
    .a { width: 1000px; }
    .a .item { width: 160px; }
    .b { width: 1200px; }
    .c { width: 600px; }
    .c .item { flex-basis: 400px; }
  </style>
</head>
<body>

  <h3>(a) space-between</h3>
  <div class="box a" id="a1" style="justify-content: space-between">
    <div class="item"></div><div class="item"></div><div class="item"></div>
  </div>

  <h3>(a) space-around</h3>
  <div class="box a" id="a2" style="justify-content: space-around">
    <div class="item"></div><div class="item"></div><div class="item"></div>
  </div>

  <h3>(a) space-evenly</h3>
  <div class="box a" id="a3" style="justify-content: space-evenly">
    <div class="item"></div><div class="item"></div><div class="item"></div>
  </div>

  <h3>(b) flex-grow</h3>
  <div class="box b" id="b">
    <div class="item" style="flex: 1 1 200px"></div>
    <div class="item" style="flex: 2 1 200px"></div>
    <div class="item" style="flex: 1 1 200px"></div>
  </div>

  <h3>(c) flex-shrink</h3>
  <div class="box c" id="c">
    <div class="item" style="flex-shrink: 1"></div>
    <div class="item" style="flex-shrink: 2"></div>
  </div>

</body>
</html>
